services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: restrocost
      POSTGRES_USER: restrocost
      POSTGRES_PASSWORD: restrocost
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restrocost -d restrocost"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - restrocost-postgres:/var/lib/postgresql/data

volumes:
  restrocost-postgres:
